name: Build Aurora Test APK

on:
  push:
    branches:
      - feature/aurora-home-screen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android TV test APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install SQLite development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compile Aurora Android TV APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: SPC-Aurora-Android-TV-debug-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
